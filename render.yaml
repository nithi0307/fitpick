# Render Blueprint — provisions FitPick as one web service plus a PostgreSQL
# database. In Render: New → Blueprint → connect this repository.
#
# The same Dockerfile also runs unchanged on Railway, Fly.io or any container
# host; only this file is Render-specific.

databases:
  - name: fitpick-db
    databaseName: fitpick
    user: fitpick
    plan: free

services:
  - type: web
    name: fitpick
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitpick-db
          property: connectionString
